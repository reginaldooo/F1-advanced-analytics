[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-advanced-analytics"
version = "0.2.0"
description = "Era-neutral cross-era F1 driver comparison: clustering, consistency and reliability."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "kagglehub>=0.3",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.40",
    "plotly>=5.18",
]
dev = [
    "streamlit>=1.40",
    "plotly>=5.18",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "nbstripout>=0.7",
    "pre-commit>=3.7",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f1 = ["status_labels.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=f1 --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["baseline"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
